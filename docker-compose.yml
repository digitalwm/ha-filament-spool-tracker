# Run SpoolTracker as a standalone Docker app with direct Bambu LAN access.
# Configure the direct printer settings below or in .env.
# 3. Use entrypoint: [] so the base image's /init does not strip env vars.
# 4. docker compose -f docker-compose.standalone.yml up -d
# 5. Open http://localhost:3000

services:
  spooltracker:
    build: .
    image: ha-filament-spooltracker:latest
    container_name: spooltracker
    restart: unless-stopped
    entrypoint: []
    ports:
      - "30000:3000"
    volumes:
      # Bind mount keeps DB and cache on host (e.g. ./data/app.db); override with DATA_PATH in .env
      - ${DATA_PATH:-./data}:/data
    environment:
      BAMBU_PRINTER_HOST: ${BAMBU_PRINTER_HOST:-}
      BAMBU_PRINTER_SERIAL: ${BAMBU_PRINTER_SERIAL:-}
      BAMBU_PRINTER_ACCESS_CODE: ${BAMBU_PRINTER_ACCESS_CODE:-}
      BAMBU_PRINTER_ID: ${BAMBU_PRINTER_ID:-}
      PORT: ${PORT:-3000}
      # DATABASE_URL: ${DATABASE_URL:-file:/data/app.db}
      # LOG_LEVEL: ${LOG_LEVEL:-info}
    command: ["/run-standalone.sh"]
